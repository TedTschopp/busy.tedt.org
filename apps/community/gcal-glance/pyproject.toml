[project]
name = "gcal-glance"
version = "0.1.0"
description = "Google Calendar Glance (GCal Glance) for BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "busylib>=1.3.0",
    "pillow>=13.0.0,<14",
    "httpx>=0.28.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "watchfiles>=0.21.0",
    "python-dateutil>=2.9.0",
    "types-python-dateutil>=2.9.0",
    "prek>=0.4.14",
]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PERF"]

[tool.mypy]
python_version = "3.11"
strict = true
